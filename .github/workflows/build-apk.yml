name: Build Darling Date APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare debug keystore
        env:
          SECRET_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          rm -f debug.keystore
          if [ -n "$SECRET_KEYSTORE_B64" ]; then
            if ! printf '%s' "$SECRET_KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > debug.keystore 2>/dev/null; then
              rm -f debug.keystore
            fi
          fi
          if [ ! -s debug.keystore ] && [ -f debug.keystore.base64 ]; then
            if ! tr -d '[:space:]' < debug.keystore.base64 | base64 -d > debug.keystore 2>/dev/null; then
              rm -f debug.keystore
            fi
          fi
          if [ ! -s debug.keystore ]; then
            keytool -genkey -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | grep -E "SHA1:|SHA256:" || true

      - name: Prepare google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          elif [ ! -f app/google-services.json ]; then
            echo "Warning: app/google-services.json not found! Add GOOGLE_SERVICES_JSON secret or commit app/google-services.json."
          fi

      - name: Build Debug APK
        run: gradle :app:assembleDebug

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: darling-date-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
